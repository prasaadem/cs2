<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --line: #e2e0d8;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7c7a74;
  --accent: #b87700;
  --accent-ink: #1a1200;
  --accent-soft: rgba(237, 161, 0, .14);
  --ct: #2a78d6;
  --t: #eb6834;
  --ct-soft: rgba(42, 120, 214, .12);
  --t-soft: rgba(235, 104, 52, .12);
  --bar: #2a78d6;
  --win: #1d7a3a;
  --loss: #b3261e;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1012;
    --surface: #17181b;
    --surface-2: #1f2024;
    --line: #2a2b30;
    --text: #f4f4f2;
    --text-2: #b9b8b0;
    --text-3: #85847d;
    --accent: #f0b232;
    --accent-ink: #1a1200;
    --accent-soft: rgba(240, 178, 50, .13);
    --ct: #3987e5;
    --t: #d95926;
    --ct-soft: rgba(57, 135, 229, .16);
    --t-soft: rgba(217, 89, 38, .16);
    --bar: #3987e5;
    --win: #4cc274;
    --loss: #f07167;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --surface: #17181b; --surface-2: #1f2024; --line: #2a2b30;
  --text: #f4f4f2; --text-2: #b9b8b0; --text-3: #85847d;
  --accent: #f0b232; --accent-ink: #1a1200; --accent-soft: rgba(240, 178, 50, .13);
  --ct: #3987e5; --t: #d95926; --ct-soft: rgba(57, 135, 229, .16); --t-soft: rgba(217, 89, 38, .16);
  --bar: #3987e5; --win: #4cc274; --loss: #f07167; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

/* header */
header { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 10; }
.hbar { display: flex; align-items: center; gap: 24px; height: 60px; }
.brand { font: 800 20px/1 Oxanium, sans-serif; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav::-webkit-scrollbar { display: none; }
nav a { padding: 8px 12px; border-radius: 8px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
nav a.on { color: var(--text); background: var(--surface-2); }
.hctl { display: flex; align-items: center; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.synced { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.synced.stale { color: var(--accent); }
.iconbtn { border: 1px solid var(--line); background: transparent; color: var(--text-2); border-radius: 8px; height: 32px; width: 32px; cursor: pointer; font-size: 15px; }

main { padding: 28px 0 64px; }
h1 { font: 700 30px/1.15 Oxanium, sans-serif; margin: 0; letter-spacing: .01em; }
h2 { font: 700 18px/1.2 Oxanium, sans-serif; margin: 0 0 12px; letter-spacing: .02em; }
.sub { color: var(--text-2); margin-top: 6px; }
.crumb { color: var(--text-3); font-size: 13px; margin-bottom: 8px; }
.crumb a { color: var(--text-2); }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
section { margin-top: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.tile .l { color: var(--text-2); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font: 700 28px/1.1 Oxanium, sans-serif; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { color: var(--text-3); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hero { background: linear-gradient(135deg, var(--accent-soft), transparent 70%), var(--surface); }

/* tables */
.tblwrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th { color: var(--text-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; }
th.nosort { cursor: default; }
th:hover:not(.nosort) { color: var(--text); }
th.sorted { color: var(--accent); }
th.sorted::after { content: " ▾"; }
th.sorted.asc::after { content: " ▴"; }
td { border-top: 1px solid var(--line); }
th.l, td.l { text-align: left; }
tbody tr { transition: background .1s; }
tbody tr.link { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td.rank { color: var(--text-3); width: 32px; }
td.pname { font-weight: 600; }
td.strong { font-weight: 700; }
.muted { color: var(--text-3); }
.pos { color: var(--win); }
.neg { color: var(--loss); }
tr.top1 td.rank { color: var(--accent); font-weight: 700; }
.rt { font-weight: 700; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--text-2); }
.chip.W { background: rgba(76, 194, 116, .15); color: var(--win); }
.chip.L { background: rgba(240, 113, 103, .14); color: var(--loss); }
.chip.ct { background: var(--ct-soft); color: var(--ct); }
.chip.t { background: var(--t-soft); color: var(--t); }
.mvp { color: var(--accent); font-size: 12px; margin-left: 4px; }

/* filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.flabel { color: var(--text-2); font-size: 13px; }
.note { color: var(--text-3); font-size: 12px; margin-top: 8px; }

/* night cards */
.ncards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.ncard { display: block; padding: 16px; transition: border-color .15s, transform .15s; }
.ncard:hover { border-color: var(--accent); color: inherit; transform: translateY(-1px); }
.ncard .d { font: 700 18px/1.2 Oxanium, sans-serif; }
.ncard .m { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.ncard .row { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.ncard .row b { color: var(--text); }
.maps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }

/* records */
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.rec { display: block; padding: 14px 16px; }
.rec:hover { border-color: var(--accent); color: inherit; }
.rec .l { color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.rec .v { font: 700 26px/1.1 Oxanium, sans-serif; margin-top: 6px; }
.rec .w { font-weight: 600; margin-top: 4px; }
.rec .s { color: var(--text-3); font-size: 12px; }

/* horizontal bars */
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: 120px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
.hb .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.hb .track { height: 14px; position: relative; }
.hb .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .v { text-align: right; font-weight: 600; }
.hb:hover .fill { filter: brightness(1.15); }

/* charts */
.chart { width: 100%; height: 220px; display: block; }
.chart text { fill: var(--text-3); font: 11px Inter, sans-serif; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--text-3); stroke-dasharray: 3 3; }
.chart .bar { fill: var(--bar); }
.chart .hit { fill: transparent; cursor: default; }
.chart g.b:hover .bar { filter: brightness(1.2); }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface); padding: 6px 9px; border-radius: 8px; font-size: 12px; line-height: 1.4; opacity: 0; transition: opacity .1s; max-width: 240px; }
#tip b { font-weight: 700; }

/* game page */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px; }
.side { display: flex; flex-direction: column; gap: 4px; }
.side.r { align-items: flex-end; text-align: right; }
.side .tn { font: 700 13px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
.side.ct .tn { color: var(--ct); }
.side.t .tn { color: var(--t); }
.big { font: 800 56px/1 Oxanium, sans-serif; display: flex; gap: 14px; align-items: center; }
.big .sep { color: var(--text-3); font-size: 36px; }
.big .lose { color: var(--text-3); }
.rhist { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 14px; }
.rhist span { width: 18px; height: 18px; border-radius: 4px; font-size: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; }
.rhist .C { background: var(--ct); }
.rhist .T { background: var(--t); }
.rhist span.rx { box-shadow: inset 0 -3px 0 rgba(255,255,255,.75); }
.legend i.rxkey { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--text-2); }
.rhist .D { background: var(--surface-2); color: var(--text-3); }
.teamhead { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.teamhead .bar { width: 4px; height: 20px; border-radius: 2px; }
.legend { display: flex; gap: 14px; color: var(--text-2); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* players grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.pcard { display: block; padding: 14px 16px; }
.pcard:hover { border-color: var(--accent); color: inherit; }
.pcard .n { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .r { font: 700 26px/1.1 Oxanium, sans-serif; margin-top: 6px; }
.pcard .s { color: var(--text-3); font-size: 12px; }

/* sidebar menu (small screens) */
.menubtn, .navhead, .navfoot, #scrim { display: none; }
@media (max-width: 1000px) {
  .hbar { gap: 12px; height: 56px; }
  .menubtn { display: grid; place-items: center; font-size: 18px; flex: none; }
  .hctl { margin-left: auto; }
  .hctl .toggle { display: none; }
  nav {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 40; width: min(280px, 82vw);
    flex-direction: column; gap: 2px; padding: 14px 12px 18px; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,.25);
    transform: translateX(-100%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s;
  }
  body.menu-open nav { transform: none; visibility: visible; transition: transform .22s ease; }
  nav a { padding: 11px 14px; font-size: 15px; }
  .navhead { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 14px 6px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .navfoot { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding: 16px 6px 0; border-top: 1px solid var(--line); }
  .navfoot .toggle span { display: inline; }
  #scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  body.menu-open #scrim { opacity: 1; pointer-events: auto; }
  body.menu-open { overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) { nav, #scrim { transition: none !important; } }
/* heatmap */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; color: var(--text-2); background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.hmwrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.hmcard { position: relative; padding: 8px; overflow: hidden; }
.hmcard canvas { display: block; }
.hmmsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); pointer-events: none; }
.hmmsg:empty { display: none; }
.hmbig { font: 700 32px/1.1 Oxanium, sans-serif; }
.hmside .s { font-size: 13px; line-height: 1.5; }
@media (max-width: 900px) { .hmwrap { grid-template-columns: 1fr; } }
footer { color: var(--text-3); font-size: 12px; padding: 24px 0 40px; border-top: 1px solid var(--line); }

@media (max-width: 640px) {
  .synced { font-size: 11px; }
  .brand { font-size: 18px; }
  h1 { font-size: 24px; }
  .big { font-size: 40px; }
  .score { grid-template-columns: 1fr; text-align: center; }
  .side, .side.r { align-items: center; text-align: center; }
  .hb { grid-template-columns: 90px 1fr 40px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <button class="iconbtn menubtn" id="menubtn" aria-label="Open menu" aria-expanded="false" aria-controls="nav">☰</button>
    <a class="brand" href="#/"><span class="dot"></span><span class="brandtxt"></span></a>
    <div id="scrim"></div>
    <nav id="nav" aria-label="Main">
      <div class="navhead"><span class="brand"><span class="dot"></span><span class="brandtxt"></span></span><button class="iconbtn" id="menuclose" aria-label="Close menu">✕</button></div>
      <a href="#/" data-r="">Overview</a>
      <a href="#/nights" data-r="nights">Nights</a>
      <a href="#/games" data-r="games">Games</a>
      <a href="#/maps" data-r="maps">Maps</a>
      <a href="#/players" data-r="players">Players</a>
      <a href="#/weapons" data-r="weapons">Weapons</a>
      <a href="#/utility" data-r="utility">Utility</a>
      <a href="#/rounds" data-r="rounds">Rounds</a>
      <a href="#/heatmap" data-r="heatmap">Heatmaps</a>
      <a href="#/attendance" data-r="attendance">Attendance</a>
      <a href="#/awards" data-r="awards">Awards</a>
      <div class="navfoot">
        <label class="toggle"><input type="checkbox" id="onlyFin2"><span>Completed games only</span></label>
        <span class="synced" id="synced2"></span>
      </div>
    </nav>
    <div class="hctl">
      <span class="synced" id="synced"></span>
      <label class="toggle" title="Only count games that reached the final round (excludes aim maps and abandoned games)"><input type="checkbox" id="onlyFin"><span>Completed games only</span></label>
      <button class="iconbtn" id="theme" title="Toggle light / dark">◐</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"><p class="sub">Loading stats…</p></main>
<footer class="wrap" id="foot"></footer>
<div id="tip"></div>
<script>
(() => {
  const btn = document.getElementById('menubtn');
  const open = on => {
    document.body.classList.toggle('menu-open', on);
    btn.setAttribute('aria-expanded', on);
    if (on) (document.querySelector('#nav a.on') || document.querySelector('#nav a')).focus();
  };
  btn.onclick = () => open(true);
  document.getElementById('menuclose').onclick = () => { open(false); btn.focus(); };
  document.getElementById('scrim').onclick = () => open(false);
  document.querySelectorAll('#nav a').forEach(a => a.addEventListener('click', () => open(false)));
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { open(false); btn.focus(); } });
  matchMedia('(min-width: 1001px)').addEventListener('change', e => { if (e.matches) open(false); });
})();
fetch('data/games.json', {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(DATA => {
const ALL = DATA.games;
const BYID = Object.fromEntries(ALL.map(g => [g.id, g]));
const MIN_ROUNDS_SHARE = 0.5; // a player must play half the rounds to be a game's MVP

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = v => (v == null || !isFinite(v)) ? '–' : v.toFixed(2);
const f1 = v => (v == null || !isFinite(v)) ? '–' : v.toFixed(1);
const f0 = v => (v == null || !isFinite(v)) ? '–' : Math.round(v).toString();
const pct = v => (v == null || !isFinite(v)) ? '–' : Math.round(v * 100) + '%';
const sgn = v => v > 0 ? `<span class="pos">+${v}</span>` : v < 0 ? `<span class="neg">${v}</span>` : '0';
const mapName = m => m.replace(/^(de|cs|aim|fy|ar|dz)_/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const nightDate = n => new Date(n + 'T12:00:00');
const nightLabel = (n, long) => nightDate(n).toLocaleDateString('en-US', long ? {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'} : {weekday: 'short', month: 'short', day: 'numeric'});
const timeLabel = s => { const [h, m] = s.slice(11).split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const pageTitle = t => { document.title = t ? `${t} · ${DATA.title}` : DATA.title; };
const weaponName = w => ({ak47:'AK-47', m4a1:'M4A4', m4a1_silencer:'M4A1-S', awp:'AWP', ssg08:'SSG 08', deagle:'Desert Eagle', usp_silencer:'USP-S', hkp2000:'P2000', glock:'Glock-18', p250:'P250', fiveseven:'Five-SeveN', tec9:'Tec-9', cz75a:'CZ75', elite:'Dual Berettas', revolver:'R8', galilar:'Galil AR', famas:'FAMAS', sg556:'SG 553', aug:'AUG', p90:'P90', mp9:'MP9', mac10:'MAC-10', mp7:'MP7', mp5sd:'MP5-SD', ump45:'UMP-45', bizon:'PP-Bizon', nova:'Nova', xm1014:'XM1014', mag7:'MAG-7', sawedoff:'Sawed-Off', m249:'M249', negev:'Negev', g3sg1:'G3SG1', scar20:'SCAR-20', hegrenade:'HE Grenade', inferno:'Molotov', taser:'Zeus x27', knife:'Knife', knife_t:'Knife', decoy:'Decoy', flashbang:'Flashbang', smokegrenade:'Smoke'}[w] || w);
const plink = (id, n) => `<a href="#/player/${id}">${esc(n)}</a>`;

let onlyFin = false;
try { onlyFin = localStorage.getItem('cs2.onlyFin') === '1'; } catch (e) {}
const games = () => onlyFin ? ALL.filter(g => g.fin) : ALL;

// game-level derived values
for (const g of ALL) {
  const n = g.rounds.length;
  const elig = g.p.filter(p => p.r >= n * MIN_ROUNDS_SHARE);
  g.mvp = (elig[0] || g.p[0]).id;
  g.top = g.p.slice().sort((a, b) => b.k - a.k || b.rt - a.rt)[0];
}

// latest name per player
const NAMES = {};
for (const g of ALL) for (const p of g.p) NAMES[p.id] = p.n;

function rating(k, d, r, k1, k2, k3, k4, k5) {
  if (!r) return 0;
  return (k / r / 0.679 + 0.7 * Math.max(r - d, 0) / r / 0.317 + (k1 + 4 * k2 + 9 * k3 + 16 * k4 + 25 * k5) / r / 1.277) / 2.7;
}

const SUM_KEYS = ['r','k','d','a','fa','hs','tk','sui','ek','ed','k1','k2','k3','k4','k5','awp','knife','zeus','nade','wb','ns','smoke','blindk','plant','defuse','gh','gf','gs','gm','gd','fe','ft','fself','fbd','fdur','buy','spent','ck','trade','traded','bspawn','bpick','bdrop','pA','pB','chick','brk','ud','fdmg','dinks','uniq','kdist','kdn','chat','tchat','quit','tmo'];
// $ spent in a round: eco < 1000 <= force < 3500 <= full; under 1000 while holding 4000+ = kept weapons / saved
const ECO_MAX = 1000, FULL_MIN = 3500, SAVE_MONEY = 4000;

// weapon classes
const CATS = {
  Rifle: ['ak47','m4a1','m4a1_silencer','galilar','famas','sg556','aug'],
  Sniper: ['awp','ssg08','g3sg1','scar20'],
  SMG: ['mac10','mp9','mp7','mp5sd','ump45','p90','bizon'],
  Pistol: ['glock','hkp2000','usp_silencer','p250','fiveseven','tec9','cz75a','deagle','elite','revolver'],
  Heavy: ['nova','xm1014','mag7','sawedoff','m249','negev'],

const weaponCat = w => { for (const [c, ws] of Object.entries(CATS)) if (ws.includes(w)) return c; return /^(knife|bayonet)/.test(w) ? 'Knife' : (w === 'hegrenade' || w === 'inferno') ? 'Grenade' : w === 'taser' ? 'Zeus' : 'Other'; };

}

}

        ca: 0, cw: 0, c1a: 0, c1w: 0, c2a: 0, c2w: 0, c3a: 0, c3w: 0, cbest: 0, ctR: 0, ctW: 0, tR: 0, tW: 0, pR: 0, pW: 0,
        ecoR: 0, ecoW: 0, forceR: 0, forceW: 0, fullR: 0, fullW: 0, saveR: 0, saveW: 0, saves: 0, moneySum: 0, moneyN: 0}; SUM_KEYS.forEach(k => s[k] = 0); by.set(p.id, s); }
      s.g++; s.nights.add(g.night); s.maps.add(g.map);

      for (const [w, c] of Object.entries(p.wh || {})) s.wh[w] = (s.wh[w] || 0) + c;
      for (const [w, c] of Object.entries(p.bi || {})) s.bi[w] = (s.bi[w] || 0) + c;

// clutches, sides and pistol rounds for one player in one game (adds into s)
function roundStats(s, g, p) {

    if (w && vs > s.cbest) s.cbest = vs;
  }
  const sd = p.sd || '';
  for (let i = 0; i < sd.length; i++) {
    const c = sd[i];

    else if (c === 'T') { s.tR++; s.tW += g.rounds[i] === 'T'; }
  }
  for (const i of g.pistol || []) if (sd[i] === 'C' || sd[i] === 'T') { s.pR++; s.pW += g.rounds[i] === sd[i]; }

function econDerive(s) {

function derive(s) {

  s.spg = s.g ? (s.spent || 0) / s.g : null;
  s.spk = s.k ? (s.spent || 0) / s.k : null;
  s.cwr = s.ca ? s.cw / s.ca : 0;
  s.tdr = s.d ? (s.traded || 0) / s.d : 0;

// ---------- sortable table ----------
// cols: {k, l, v?(row), f?(val,row) -> html, cls, sort?: false, asc?: bool, t?: tooltip}
function mountTable(el, cols, rows, opt = {}) {
  let sortKey = opt.sort, asc = !!opt.asc;
  const val = (c, r) => c.v ? c.v(r) : r[c.k];
  function render() {
    const col = cols.find(c => c.k === sortKey);
    const sorted = col ? rows.slice().sort((a, b) => {
      let x = val(col, a), y = val(col, b);
      if (x == null) return 1; if (y == null) return -1;
      if (typeof x === 'string') return asc ? x.localeCompare(y) : y.localeCompare(x);
      return asc ? x - y : y - x;
    }) : rows;
    const head = (opt.rank ? '<th class="nosort"></th>' : '') + cols.map(c =>
      `<th class="${c.cls || ''} ${c.sort === false ? 'nosort' : ''} ${c.k === sortKey ? 'sorted' + (asc ? ' asc' : '') : ''}" data-k="${c.k}"${c.t ? ` title="${esc(c.t)}"` : ''}>${c.l}</th>`).join('');
    const body = sorted.map((r, i) =>
      `<tr class="${opt.href ? 'link' : ''} ${opt.rank && i === 0 ? 'top1' : ''}"${opt.href ? ` data-href="${opt.href(r)}"` : ''}>` +
      (opt.rank ? `<td class="rank">${i + 1}</td>` : '') +
      cols.map(c => { const v = val(c, r); return `<td class="${c.cls || ''}">${c.f ? c.f(v, r) : (v == null ? '–' : esc(v))}</td>`; }).join('') + '</tr>').join('');
    el.innerHTML = `<div class="tblwrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 1}" class="l muted">No data</td></tr>`}</tbody></table></div>`;
    el.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
      const c = cols.find(c => c.k === th.dataset.k);
      if (!c || c.sort === false) return;
      if (sortKey === c.k) asc = !asc; else { sortKey = c.k; asc = !!c.asc; }
      render();
    });
    el.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = e => { if (!e.target.closest('a')) location.hash = tr.dataset.href; });
  }
  render();
}

// ---------- charts ----------
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
// single-series vertical bar chart; items: {label, value, tip, href?}
function vbars(items, {height = 220, ref = null, fmt = f0} = {}) {
  const W = 720, H = height, L = 36, R = 8, T = 12, B = 30;
  const max = Math.max(...items.map(i => i.value), ref || 0) * 1.1 || 1;
  const step = niceStep(max / 4);
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  const bw = (W - L - R) / items.length, gap = Math.min(bw * 0.3, 14);
  const y = v => T + (H - T - B) * (1 - v / max);
  const every = Math.ceil(items.length / 12);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">`;
  for (const t of ticks) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  items.forEach((it, i) => {
    const x = L + i * bw + gap / 2, w = bw - gap, top = y(Math.max(it.value, 0));
    const tag = it.href ? 'a' : 'g';
    s += `<${tag} class="b" ${it.href ? `href="${it.href}"` : ''} data-tip="${esc(it.tip)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
    if (it.value > 0) s += `<path class="bar" d="${barPath(x, top, w, y(0) - top, 4)}"/>`;
    s += `</${tag}>`;
    if (i % every === 0) s += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  if (ref != null) s += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/>`;
  return s + '</svg>';
}
function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x || 1))), n = x / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
// horizontal bars; items: {label, value, tip, href?}
function hbars(items, fmt = v => v) {
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="hbars">${items.map(i => `<${i.href ? `a href="${i.href}"` : 'div'} class="hb" data-tip="${esc(i.tip || '')}"><span class="n">${esc(i.label)}</span><span class="track"><span class="fill" style="display:block;width:${(i.value / max * 100).toFixed(1)}%"></span></span><span class="v">${fmt(i.value)}</span></${i.href ? 'a' : 'div'}>`).join('')}</div>`;
}

  return hbars(items.map(([w, c]) => ({label: weaponName(w), value: c, href: `#/weapon/${w}`, tip: `<b>${esc(weaponName(w))}</b><br>${c} kills · ${pct(c / tot)} of all`})));
}

  ], rows, {sort: 'gt'});
}

function viewMaps() {
  pageTitle('Maps');
  const gs = games();
  const by = {};
  for (const g of gs) (by[g.map] = by[g.map] || []).push(g);
  const rows = Object.entries(by).map(([m, mg]) => {
    const rs = mg.map(g => g.rounds).join('');
    const ct = [...rs].filter(c => c === 'C').length, t = [...rs].filter(c => c === 'T').length;
    const agg = aggregate(mg).filter(r => r.g >= Math.min(2, mg.length));
    const best = agg.sort((a, b) => b.rt - a.rt)[0];
    const kills = mg.reduce((s, g) => s + g.p.reduce((a, p) => a + p.k, 0), 0);
    return {map: m, n: mapName(m), g: mg.length, fin: mg.filter(g => g.fin).length, ctw: (ct + t) ? ct / (ct + t) : null,
      avgR: rs.length / mg.length, kpg: kills / mg.length, last: mg.map(g => g.night).sort().pop(), best};
  });
  $('#app').innerHTML = `<div class="pagehead"><div><h1>Maps</h1><div class="sub">${rows.length} maps played</div></div></div>
    <div id="mt"></div><div class="note">CT round win % counts every round on the map. Best player needs 2+ games on the map (when available).</div>`;
  mountTable($('#mt'), [
    {k: 'n', l: 'Map', cls: 'l pname', asc: true, f: (v, r) => `<a href="#/map/${r.map}">${esc(v)}</a>`},
    {k: 'g', l: 'Played'}, {k: 'fin', l: 'Completed'},
    {k: 'ctw', l: 'CT rounds', f: v => v == null ? '–' : `<span style="color:var(--ct)">${pct(v)}</span> / <span style="color:var(--t)">${pct(1 - v)}</span>`},
    {k: 'avgR', l: 'Avg rounds', f: f1}, {k: 'kpg', l: 'Kills / game', f: f0},
    {k: 'bestn', l: 'Best player', cls: 'l', v: r => r.best ? r.best.rt : null, f: (v, r) => r.best ? `${esc(r.best.n)} <span class="muted">${f2(r.best.rt)}</span>` : '–'},
    {k: 'last', l: 'Last played', cls: 'l', f: v => nightLabel(v)},
  ], rows, {sort: 'g', href: r => `#/map/${r.map}`});
}

function viewWeapons() {
  pageTitle('Weapons');
  const gs = games();
  const rows = aggregate(gs);
  const all = {}, allHs = {}, users = {};
  for (const r of rows) {
    for (const [w0, c] of Object.entries(r.wp)) { const w = normWeapon(w0); all[w] = (all[w] || 0) + c; (users[w] = users[w] || {})[r.id] = [r, ((users[w][r.id] || [])[1] || 0) + c]; }
    for (const [w0, c] of Object.entries(r.wh)) { const w = normWeapon(w0); allHs[w] = (allHs[w] || 0) + c; }
  }
  const tot = Object.values(all).reduce((a, b) => a + b, 0) || 1;
  const wrows = Object.entries(all).map(([w, k]) => {
    const us = Object.values(users[w]).sort((a, b) => b[1] - a[1]);
    return {w, n: weaponName(w), cat: weaponCat(w), k, share: k / tot, hsp: (allHs[w] || 0) / k, users: us.length, top: us[0], second: us[1]};
  });
  const most = wrows.slice().sort((a, b) => b.k - a.k)[0];
  const maxG = Math.max(...rows.map(r => r.g));
  const regulars = rows.filter(r => r.g >= Math.min(5, maxG));
  const awper = rows.slice().sort((a, b) => b.awp - a.awp)[0];
  const hsKing = regulars.filter(r => r.k >= 30).sort((a, b) => b.hsp - a.hsp)[0];
  const loyal = regulars.filter(r => r.k >= 30).sort((a, b) => b.favShare - a.favShare)[0];
  const varied = regulars.slice().sort((a, b) => b.nw - a.nw)[0];
  const cats = {}; for (const w of wrows) cats[w.cat] = (cats[w.cat] || 0) + w.k;

  $('#app').innerHTML = `
    <div class="pagehead"><div><h1>Weapons</h1><div class="sub">${tot.toLocaleString()} kills with ${wrows.length} different weapons</div></div></div>
    <div class="tiles">
      ${tile('Most used', esc(most.n), `${most.k} kills · ${pct(most.share)} of all`, true)}
      ${awper && awper.awp ? tile('Top AWPer', esc(awper.n), `${awper.awp} AWP kills`) : ''}
      ${hsKing ? tile('Headshot machine', esc(hsKing.n), `${pct(hsKing.hsp)} headshots`) : ''}
      ${loyal ? tile('Most loyal', esc(loyal.n), `${pct(loyal.favShare)} of kills with ${esc(weaponName(loyal.fav))}`) : ''}
      ${varied ? tile('Most versatile', esc(varied.n), `kills with ${varied.nw} weapons`) : ''}
    </div>
    <section><h2>Favourite weapon by player</h2><div id="pw"><div class="filters"></div><div class="t"></div></div>
      <div class="note">Class columns show each player's share of their own kills. Click a weapon for its leaderboard.</div></section>
    <section class="grid2">
      <div class="card pad"><h2>Kills by weapon</h2>${weaponsBlock(all, 15)}</div>
      <div class="card pad"><h2>Kills by weapon class</h2>${hbars(Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, k]) => ({label: c, value: k, tip: `<b>${c}</b><br>${k} kills · ${pct(k / tot)}`})))}</div>
    </section>
    <section><h2>Weapon leaders</h2><div id="wt"></div></section>`;

  const share = c => ({k: 'c_' + c, l: c, v: r => catShare(r.wp)[c] || 0, f: v => v ? pct(v) : '<span class="muted">–</span>'});
  const wcell = (r, i) => { const t = topWeapons(r.wp, i + 1)[i]; return t ? `<a href="#/weapon/${t[0]}">${esc(weaponName(t[0]))}</a> <span class="muted">${t[1]}</span>` : '–'; };
  const cols = [
    C.player, C.g, C.k,

    {k: 'w2', l: '2nd', cls: 'l', sort: false, f: (v, r) => wcell(r, 1)},
    {k: 'w3', l: '3rd', cls: 'l', sort: false, f: (v, r) => wcell(r, 2)},
    share('Rifle'), share('Sniper'), share('SMG'), share('Pistol'), share('Heavy'),
    {k: 'nw', l: 'Weapons', t: 'Different weapons with at least one kill'},
    {k: 'kdm', l: 'Kill dist', t: 'Average distance to the enemy on a kill', f: v => v == null ? '–' : f1(v) + ' m'},
  ];
  const draw = mg => mountTable($('#pw .t'), cols, rows.filter(r => r.g >= mg), {sort: 'k', rank: true});
  const def = Math.min(5, maxG);
  minGamesFilter($('#pw .filters'), rows, def, draw);
  draw(def);

  mountTable($('#wt'), [

function viewWeapon(w) {
  const gs = games();
  pageTitle(weaponName(w));
  const wk = wp => Object.entries(wp || {}).reduce((s, [x, c]) => s + (normWeapon(x) === w ? c : 0), 0);
  const rows = aggregate(gs).map(r => {
    const k = wk(r.wp);
    return Object.assign(r, {wk: k, whs: k ? wk(r.wh) / k : 0, wshare: r.k ? k / r.k : 0, wpr: r.r ? k / r.r : 0});
  }).filter(r => r.wk);
  if (!rows.length) return notFound();
  const tot = rows.reduce((s, r) => s + r.wk, 0);
  const hs = rows.reduce((s, r) => s + wk(r.wh), 0);
  const allK = rows.length ? gs.reduce((s, g) => s + g.p.reduce((a, p) => a + p.k, 0), 0) : 1;
  const nights = [...new Set(gs.map(g => g.night))].sort();
  const per = nights.map(n => ({n, k: gs.filter(g => g.night === n).reduce((s, g) => s + g.p.reduce((a, p) => a + wk(p.w), 0), 0)}));
  const lead = rows.slice().sort((a, b) => b.wk - a.wk)[0];
  $('#app').innerHTML = `
    <div class="crumb"><a href="#/weapons">Weapons</a> / ${esc(weaponName(w))}</div>

    <div class="tiles">
      ${tile('Leader', esc(lead.n), `${lead.wk} kills · ${pct(lead.wk / tot)} of the total`, true)}
      ${tile('Kills', tot, `${pct(tot / allK)} of all kills`)}
      ${tile('Headshots', pct(hs / tot), `${hs} HS kills`)}
      ${tile('Players', rows.length)}

      <div class="note">“Share” is how much of that player's own kills came with this weapon.</div></section>

  mountTable($('#lb'), [C.player, C.g, {k: 'wk', l: 'Kills'}, {k: 'whs', l: 'HS%', f: pct}, {k: 'wshare', l: 'Share', f: pct},

function viewUtility(night) {
  const all = games();
  const nights = [...new Set(all.map(g => g.night))].sort().reverse();
  const gs = night ? all.filter(g => g.night === night) : all;
  pageTitle(night ? `Utility · ${nightLabel(night)}` : 'Utility');
  if (!gs.length) return notFound();
  const rows = aggregate(gs);
  const sum = k => rows.reduce((s, r) => s + (r[k] || 0), 0);
  const top = (k, f = r => true) => rows.filter(r => f(r) && r[k] > 0).sort((a, b) => b[k] - a[k])[0];
  const thrown = {HE: sum('gh'), Flashbang: sum('gf'), Smoke: sum('gs'), 'Molotov / Incendiary': sum('gm'), Decoy: sum('gd')};
  const bi = {}, pkw = {};
  rows.forEach(r => { for (const [w, c] of Object.entries(r.bi)) bi[w] = (bi[w] || 0) + c; for (const [w, c] of Object.entries(r.pkw)) pkw[w] = (pkw[w] || 0) + c; });
  const old = gs.filter(g => !(g.v >= 2)).length;
  const t1 = top('gt'), t2 = top('fe'), t3 = top('ft'), t4 = top('spent'), t5 = top('pk'), t6 = top('fbd');
  const card = (l, r, v, s) => r ? tile(l, esc(r.n), `${v} · ${s}`) : '';

  $('#app').innerHTML = `
    <div class="pagehead"><div><h1>Utility &amp; economy</h1><div class="sub">${night ? esc(nightLabel(night, true)) : 'All nights'} · ${gs.length} games</div></div>
      <div class="filters"><span class="flabel">Night</span><select id="un"><option value="">All nights</option>${nights.map(n => `<option value="${n}" ${n === night ? 'selected' : ''}>${esc(nightLabel(n))}</option>`).join('')}</select></div></div>
    <div class="tiles">
      ${tile('Grenades thrown', sum('gt').toLocaleString(), `${sum('fe').toLocaleString()} enemies flashed`, true)}
      ${card('Grenade spammer', t1, t1?.gt + ' thrown', f2(t1?.gpr) + ' per round')}
      ${card('Flash king', t2, t2?.fe + ' enemies blinded', Math.round(t2?.fdur || 0) + 's total')}
      ${card('Team flasher', t3, t3?.ft + ' teammates blinded', 'oops')}
      ${card('Big spender', t4, '$' + Math.round(t4?.spent || 0).toLocaleString(), (t4?.buy || 0) + ' items')}
      ${card('Scavenger', t5, t5?.pk + ' picked-up kills', t5 ? 'mostly ' + weaponName((topWeapons(t5.pkw, 1)[0] || ['–'])[0]) : '')}
      ${card('Always blind', t6, t6?.fbd + ' times flashed', 'by enemies')}
    </div>
    ${old ? `<div class="note">${old} game${old > 1 ? 's' : ''} parsed before utility tracking show 0 here until the next daily update re-reads their logs.</div>` : ''}
    <section><h2>Grenades &amp; flashes</h2><div id="ut"><div class="filters"></div><div class="t"></div></div></section>
    <section><h2>Economy, purchases &amp; pickups</h2><div id="et"><div class="filters"></div><div class="t"></div></div>
      <div class="note">Buy types use what a player spent in the round: eco under $1,000 with less than $4,000 in the bank, kept/saved under $1,000 with $4,000+ (usually kept last round's weapons), force $1,000–3,499, full buy $3,500+ (armor isn't logged, so real spend is a bit higher). Spent is estimated from CS2 list prices; armor, kits and dropped-for-teammates buys can't be told apart in the logs. Picked-up kills are kills with a weapon the player never bought that game (spawn pistols excluded, aim maps skipped).</div></section>
    <section class="grid3">
      <div class="card pad"><h2>Grenades by type</h2>${hbars(Object.entries(thrown).map(([l, v]) => ({label: l, value: v, tip: `<b>${l}</b><br>${v} thrown`})))}</div>
      <div class="card pad"><h2>Most bought</h2>${hbars(topWeapons(bi, 12).map(([w, c]) => ({label: weaponName(w), value: c, tip: `<b>${esc(weaponName(w))}</b><br>bought ${c}×`})))}</div>
      <div class="card pad"><h2>Picked-up kills by weapon</h2>${Object.keys(pkw).length ? hbars(topWeapons(pkw, 12).map(([w, c]) => ({label: weaponName(w), value: c, href: `#/weapon/${w}`, tip: `<b>${esc(weaponName(w))}</b><br>${c} kills with a picked-up one`}))) : '<p class="muted">None yet</p>'}</div>
    </section>`;
  $('#un').onchange = e => { location.hash = e.target.value ? `#/utility/${e.target.value}` : '#/utility'; };
  const def = night ? 1 : Math.min(5, Math.max(...rows.map(r => r.g)));
  for (const [id, cols, sort] of [['#ut', [C.player, C.g, ...UTIL_COLS], 'gt'], ['#et', [C.player, C.g, C.k, ...ECON_COLS], 'spent']]) {
    const el = $(id);
    const draw = mg => mountTable($('.t', el), cols, rows.filter(r => r.g >= mg), {sort, rank: true});
    minGamesFilter($('.filters', el), rows, def, draw);
    draw(def);
  }
}

const REASON = {e: 'elimination', b: 'bomb exploded', d: 'bomb defused', t: 'time ran out', '-': 'draw'};
const R = {
  clutch: {k: 'cw', l: 'Clutches', t: 'Clutches won / attempted (last alive on your side vs 1+ enemies)', f: (v, r) => r.ca ? `${r.cw}/${r.ca}` : '<span class="muted">–</span>'},
  cwr: {k: 'cwr', l: 'Clutch %', f: (v, r) => r.ca ? pct(v) : '–'},
  c1: {k: 'c1w', l: '1v1', f: (v, r) => r.c1a ? `${r.c1w}/${r.c1a}` : '<span class="muted">–</span>'},
  c2: {k: 'c2w', l: '1v2', f: (v, r) => r.c2a ? `${r.c2w}/${r.c2a}` : '<span class="muted">–</span>'},
  c3: {k: 'c3w', l: '1v3+', f: (v, r) => r.c3a ? `${r.c3w}/${r.c3a}` : '<span class="muted">–</span>'},
  best: {k: 'cbest', l: 'Best', t: 'Biggest clutch won', f: v => v ? `1v${v}` : '<span class="muted">–</span>'},
  ck: {k: 'ck', l: 'Clutch kills', t: 'Kills made while clutching'},
  trade: {k: 'trade', l: 'Trades', t: 'Kills on an enemy within 5s of them killing your teammate'},
  traded: {k: 'tdr', l: 'Deaths traded', t: 'Share of your deaths a teammate avenged within 5s', f: (v, r) => r.d ? pct(v) : '–'},
  carry: {k: 'carry', l: 'Bomb carried', t: 'Times holding the bomb (spawned with it or picked it up)'},
  bpick: {k: 'bpick', l: 'Picked up', t: 'Picked up a dropped bomb'},
  bdrop: {k: 'bdrop', l: 'Dropped', t: 'Dropped the bomb (including on death)'},
  pA: {k: 'pA', l: 'Plants A'}, pB: {k: 'pB', l: 'Plants B'}, defuse: {k: 'defuse', l: 'Defuses'},
  ctw: {k: 'ctwr', l: 'CT win %', f: (v, r) => r.ctR ? `${pct(v)} <span class="muted">${r.ctR}</span>` : '–'},
  tw: {k: 'twr', l: 'T win %', f: (v, r) => r.tR ? `${pct(v)} <span class="muted">${r.tR}</span>` : '–'},
  pw: {k: 'pwr', l: 'Pistol rounds', t: 'Pistol rounds won / played', f: (v, r) => r.pR ? `${r.pW}/${r.pR}` : '–'},
  rw: {k: 'rwr', l: 'Round win %', t: 'Share of rounds played that your side won', f: (v, r) => (r.ctR + r.tR) ? pct(v) : '–'},
};

function roundBlock(gs, title) {
  const cnt = {};
  let A = 0, B = 0, aW = 0, bW = 0;
  for (const g of gs) {
    [...(g.rr || '')].forEach(c => cnt[c] = (cnt[c] || 0) + 1);
    [...(g.rp || '')].forEach((s, i) => {
      if (s === 'A' || s === 'B') { const tWin = g.rounds[i] === 'T'; if (s === 'A') { A++; aW += tWin; } else { B++; bW += tWin; } }
    });
  }
  const tot = Object.values(cnt).reduce((a, b) => a + b, 0) || 1;
  return `<div class="card pad"><h2>${title}</h2>${hbars(['e', 'b', 'd', 't'].filter(k => cnt[k]).map(k => ({label: REASON[k][0].toUpperCase() + REASON[k].slice(1), value: cnt[k], tip: `<b>${REASON[k]}</b><br>${cnt[k]} rounds · ${pct(cnt[k] / tot)}`})))}
    ${A + B ? `<h2 style="margin-top:20px">Bomb sites</h2>${hbars([{label: `A (T won ${pct(aW / (A || 1))})`, value: A, tip: `<b>Site A</b><br>${A} plants · T won ${aW} of them`}, {label: `B (T won ${pct(bW / (B || 1))})`, value: B, tip: `<b>Site B</b><br>${B} plants · T won ${bW} of them`}])}` : ''}</div>`;
}

function viewRounds(night) {
  const all = games();
  const nights = [...new Set(all.map(g => g.night))].sort().reverse();
  const gs = night ? all.filter(g => g.night === night) : all;
  pageTitle(night ? `Rounds · ${nightLabel(night)}` : 'Rounds');
  if (!gs.length) return notFound();
  const rows = aggregate(gs);
  const top = (k, f = () => true) => rows.filter(r => f(r) && r[k] > 0).sort((a, b) => b[k] - a[k] || b.cwr - a.cwr)[0];
  const big = gs.flatMap(g => g.p.flatMap(p => (p.cl || []).filter(c => c[1]).map(c => ({vs: c[0], p, g})))).sort((a, b) => b.vs - a.vs)[0];
  const t1 = top('cw'), t2 = top('trade'), t3 = top('carry'), t4 = top('bdrop'), t5 = top('pwr', r => r.pR >= 3);
  const old = gs.filter(g => !(g.v >= 3)).length;
  $('#app').innerHTML = `
    <div class="pagehead"><div><h1>Rounds</h1><div class="sub">${night ? esc(nightLabel(night, true)) : 'All nights'} · ${gs.reduce((s, g) => s + g.rounds.length, 0).toLocaleString()} rounds in ${gs.length} games</div></div>
      <div class="filters"><span class="flabel">Night</span><select id="rn"><option value="">All nights</option>${nights.map(n => `<option value="${n}" ${n === night ? 'selected' : ''}>${esc(nightLabel(n))}</option>`).join('')}</select></div></div>
    <div class="tiles">
      ${t1 ? tile('Clutch king', esc(t1.n), `${t1.cw} clutches won of ${t1.ca}`, true) : ''}
      ${big ? `<a href="#/game/${big.g.id}" style="display:contents">${tile('Biggest clutch', '1v' + big.vs, `${esc(big.p.n)} · ${esc(mapName(big.g.map))}, ${esc(nightLabel(big.g.night))}`)}</a>` : ''}
      ${t2 ? tile('Trade master', esc(t2.n), `${t2.trade} trade kills`) : ''}
      ${t3 ? tile('Bomb mule', esc(t3.n), `carried the bomb ${t3.carry}×`) : ''}
      ${t4 ? tile('Butterfingers', esc(t4.n), `dropped the bomb ${t4.bdrop}×`) : ''}
      ${t5 ? tile('Pistol ace', esc(t5.n), `won ${t5.pW} of ${t5.pR} pistol rounds`) : ''}
    </div>
    ${old ? `<div class="note">${old} game${old > 1 ? 's' : ''} parsed before round tracking show nothing here until the next daily update re-reads their logs.</div>` : ''}
    <section><h2>Clutches</h2><div id="tc"><div class="filters"></div><div class="t"></div></div></section>
    <section><h2>Trades, sides &amp; pistol rounds</h2><div id="tt"><div class="filters"></div><div class="t"></div></div>
      <div class="note">Your server doesn't swap sides at half time, so most players spend a whole game on one side; pistol rounds are each game's first round.</div></section>
    <section><h2>Bomb</h2><div id="tb"><div class="filters"></div><div class="t"></div></div></section>
    <section class="grid2">${roundBlock(gs, 'How rounds ended')}
      <div class="card pad"><h2>Clutch success by situation</h2>${(() => {
        const s = {}; gs.forEach(g => g.p.forEach(p => (p.cl || []).forEach(([vs, w]) => { const k = Math.min(vs, 5); s[k] = s[k] || [0, 0]; s[k][0] += w; s[k][1]++; })));
        return Object.keys(s).length ? hbars(Object.entries(s).map(([k, [w, a]]) => ({label: `1v${k}${k == 5 ? '+' : ''} (${w}/${a})`, value: w / a, tip: `<b>1v${k}${k == 5 ? '+' : ''}</b><br>won ${w} of ${a}`})), pct) : '<p class="muted">No clutches yet</p>';
      })()}</div></section>`;
  $('#rn').onchange = e => { location.hash = e.target.value ? `#/rounds/${e.target.value}` : '#/rounds'; };
  const def = night ? 1 : Math.min(5, Math.max(...rows.map(r => r.g)));
  for (const [id, cols, sort] of [
    ['#tc', [C.player, C.g, R.clutch, R.cwr, R.c1, R.c2, R.c3, R.best, R.ck], 'cw'],
    ['#tt', [C.player, C.g, R.trade, R.traded, C.entry, R.rw, R.ctw, R.tw, R.pw], 'trade'],
    ['#tb', [C.player, C.g, R.carry, R.bpick, R.bdrop, R.pA, R.pB, R.defuse], 'carry'],
  ]) {
    const el = $(id);
    const draw = mg => mountTable($('.t', el), cols, rows.filter(r => r.g >= mg), {sort, rank: true});
    minGamesFilter($('.filters', el), rows, def, draw);
    draw(def);
  }
}

// ---------- heatmaps (positions are loaded lazily, only on this page) ----------
let POS = null, posLoading = null;
const loadPositions = () => POS ? Promise.resolve(POS) : (posLoading = posLoading || fetch('data/positions.json', {cache: 'no-cache'}).then(r => r.json()).then(d => (POS = d)));
const HM = {mode: 'kills', view: 'heat', nade: '', side: '', player: '', night: '', lines: false};
const NADE_NAME = {s: 'Smoke', m: 'Molotov / Incendiary', h: 'HE grenade', f: 'Flashbang', d: 'Decoy'};
const UNIT_M = 0.0254; // one Hammer unit is an inch
let hmRedraw = null;
addEventListener('resize', () => { if (hmRedraw && document.getElementById('hm')) hmRedraw(); });

function viewHeatmap(map, gid) {
  const gs = games().filter(g => g.v >= 5);
  const byMap = {};
  gs.forEach(g => (byMap[g.map] = byMap[g.map] || []).push(g));
  const maps = Object.keys(byMap).sort((a, b) => byMap[b].length - byMap[a].length);
  if (!maps.length) { $('#app').innerHTML = '<h1>Heatmaps</h1><p class="sub">No games with position data yet.</p>'; return; }
  if (!map || !byMap[map]) { location.replace(`#/heatmap/${maps[0]}`); return; }
  pageTitle(`Heatmap · ${mapName(map)}`);
  const mg = byMap[map];
  const nights = [...new Set(mg.map(g => g.night))].sort().reverse();
  const game = gid && mg.find(g => g.id === gid);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;

  $('#app').innerHTML = `
    <div class="pagehead"><div><h1>Heatmaps</h1><div class="sub">Where players get kills, die and land grenades</div></div>
      <div class="filters"><span class="flabel">Map</span><select id="hmap">${maps.map(m => opt(m, `${mapName(m)} (${byMap[m].length})`, map)).join('')}</select></div></div>
    <div class="filters hmf">
      <div class="seg" id="hmode">${[['kills', 'Kills'], ['deaths', 'Deaths'], ['nades', 'Grenades']].map(([v, l]) => `<button data-v="${v}" class="${HM.mode === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="seg" id="hview">${[['heat', 'Heat'], ['dots', 'Dots']].map(([v, l]) => `<button data-v="${v}" class="${HM.view === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <select id="hnade" ${HM.mode === 'nades' ? '' : 'hidden'}>${opt('', 'All grenades', HM.nade)}${Object.entries(NADE_NAME).map(([k, v]) => opt(k, v, HM.nade)).join('')}</select>
      <select id="hside">${opt('', 'Both sides', HM.side)}${opt('C', 'CT', HM.side)}${opt('T', 'T', HM.side)}</select>
      <select id="hplayer"><option value="">All players</option></select>
      <select id="hnight">${opt('', 'All nights', game ? '' : HM.night)}${nights.map(n => opt(n, nightLabel(n), game ? '' : HM.night)).join('')}</select>
      <select id="hgame">${opt('', 'All games', game ? game.id : '')}${mg.slice().reverse().map(g => opt(g.id, `${nightLabel(g.night)} ${timeLabel(g.start)} · ${g.ct}:${g.t}`, game ? game.id : '')).join('')}</select>
      <label class="toggle" id="hlinesw" ${HM.mode === 'kills' && HM.view === 'dots' ? '' : 'hidden'}><input type="checkbox" id="hlines" ${HM.lines ? 'checked' : ''}><span>Killer → victim lines</span></label>
    </div>
    <div class="hmwrap"><div class="card hmcard"><canvas id="hm"></canvas><div class="hmmsg" id="hmmsg">Loading positions…</div></div>
      <div class="card pad hmside" id="hmstats"></div></div>
    <div class="note">Faint grey dots are every kill, death and grenade ever recorded on this map, which traces its layout. Positions come from the server log at the moment of each kill and where each grenade landed; full movement needs GOTV demos.</div>`;

  const sel = id => $('#' + id);
  sel('hmap').onchange = e => { location.hash = `#/heatmap/${e.target.value}`; };
  sel('hgame').onchange = e => { location.hash = e.target.value ? `#/heatmap/${map}/${e.target.value}` : `#/heatmap/${map}`; };
  sel('hnight').onchange = e => { HM.night = e.target.value; if (game) location.hash = `#/heatmap/${map}`; else draw(); };
  sel('hside').onchange = e => { HM.side = e.target.value; draw(); };
  sel('hnade').onchange = e => { HM.nade = e.target.value; draw(); };
  sel('hplayer').onchange = e => { HM.player = e.target.value; draw(); };
  sel('hlines').onchange = e => { HM.lines = e.target.checked; draw(); };
  for (const [id, key] of [['hmode', 'mode'], ['hview', 'view']]) {
    sel(id).onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      HM[key] = b.dataset.v;
      sel(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      sel('hnade').hidden = HM.mode !== 'nades';
      sel('hlinesw').hidden = !(HM.mode === 'kills' && HM.view === 'dots');
      draw();
    };
  }

  let pts = [], bounds = null, base = [], tf = null;
  const canvas = sel('hm');

  loadPositions().then(() => {
    if (!document.body.contains(canvas)) return;
    // every point ever recorded on the map: fixed bounds + faint layout
    for (const g of byMap[map]) {
      const [kp, np] = POS[g.id] || [[], []];
      for (const k of kp) { base.push([k[5], k[6]], [k[8], k[9]]); }
      for (const n of np) base.push([n[5], n[6]]);
    }
    if (!base.length) { sel('hmmsg').textContent = 'No positions recorded on this map yet.'; return; }
    const xs = base.map(p => p[0]), ys = base.map(p => p[1]);
    bounds = {x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys)};
    // players who appear on this map
    const names = {};
    for (const g of byMap[map]) g.p.forEach(p => names[p.id] = NAMES[p.id]);
    sel('hplayer').innerHTML = '<option value="">All players</option>' + Object.entries(names).sort((a, b) => a[1].localeCompare(b[1])).map(([id, n]) => opt(id, n, HM.player)).join('');
    sel('hmmsg').textContent = '';
    draw();
  });
  hmRedraw = draw;

  function selected() {
    const out = [];
    const list = game ? [game] : byMap[map].filter(g => !HM.night || g.night === HM.night);
    for (const g of list) {
      const [kp, np] = POS[g.id] || [[], []];
      if (HM.mode === 'nades') {
        for (const n of np) {
          if (HM.nade && n[4] !== HM.nade) continue;
          if (HM.side && n[3] !== HM.side) continue;
          if (HM.player && n[2] !== HM.player) continue;
          out.push({x: n[5], y: n[6], side: n[3], g, n});
        }
      } else {
        for (const k of kp) {
          const kills = HM.mode === 'kills';
          const side = kills ? k[4] : (k[4] === 'C' ? 'T' : 'C');
          if (HM.side && side !== HM.side) continue;
          if (HM.player && (kills ? k[2] : k[3]) !== HM.player) continue;
          out.push({x: kills ? k[5] : k[8], y: kills ? k[6] : k[9], side, g, k});
        }
      }
    }
    return out;
  }

  function draw() {
    if (!bounds || !document.body.contains(canvas)) return;
    const css = getComputedStyle(document.documentElement);
    const col = v => css.getPropertyValue(v).trim();
    const W = canvas.parentElement.clientWidth;
    const rx = bounds.x1 - bounds.x0 || 1, ry = bounds.y1 - bounds.y0 || 1;
    const pad = 16, H = Math.min(Math.round((W - 2 * pad) * ry / rx) + 2 * pad, Math.round(innerHeight * 0.78));
    const sc = Math.min((W - 2 * pad) / rx, (H - 2 * pad) / ry);
    const ox = (W - rx * sc) / 2, oy = (H - ry * sc) / 2;
    tf = (x, y) => [ox + (x - bounds.x0) * sc, oy + (bounds.y1 - y) * sc]; // game y points up
    const dpr = devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    c.fillStyle = col('--text-3'); c.globalAlpha = 0.22;
    for (const [x, y] of base) { const [px, py] = tf(x, y); c.fillRect(px - 0.75, py - 0.75, 1.5, 1.5); }
    c.globalAlpha = 1;

    pts = selected();
    for (const p of pts) [p.px, p.py] = tf(p.x, p.y);
    if (HM.view === 'heat') heat(c, W, H, dpr, col('--accent'));
    else {
      if (HM.lines && HM.mode === 'kills') {
        c.lineWidth = 1; c.globalAlpha = 0.35;
        for (const p of pts) { const [vx, vy] = tf(p.k[8], p.k[9]); c.strokeStyle = col(p.side === 'C' ? '--ct' : '--t'); c.beginPath(); c.moveTo(p.px, p.py); c.lineTo(vx, vy); c.stroke(); }
        c.globalAlpha = 1;
      }
      for (const p of pts) {
        c.beginPath(); c.arc(p.px, p.py, 4, 0, 7);
        c.fillStyle = col(p.side === 'C' ? '--ct' : p.side === 'T' ? '--t' : '--text-2'); c.fill();
        c.lineWidth = 1.5; c.strokeStyle = col('--surface'); c.stroke();
      }
    }
    stats();
  }

  // density: count events per grid cell, blur, scale to the busy end, tint with one hue (faint -> bright)
  function heat(c, W, H, dpr, hue) {
    const cell = 3, gw = Math.ceil(W / cell), gh = Math.ceil(H / cell);
    let grid = new Float32Array(gw * gh);
    for (const p of pts) {
      const gx = Math.floor(p.px / cell), gy = Math.floor(p.py / cell);
      if (gx >= 0 && gy >= 0 && gx < gw && gy < gh) grid[gy * gw + gx]++;
    }
    const rad = Math.max(2, Math.round(Math.min(W, H) / 70 / cell));
    for (let pass = 0; pass < 3; pass++) grid = boxBlur(grid, gw, gh, rad);
    const nz = [];
    for (const v of grid) if (v > 1e-4) nz.push(v);
    if (!nz.length) return;
    nz.sort((x, y) => x - y);
    const top = nz[Math.floor(nz.length * 0.985)] || nz[nz.length - 1];
    const [hr, hg, hb] = hexRgb(hue);
    const img = new ImageData(gw, gh), d = img.data;
    for (let i = 0; i < grid.length; i++) {
      const t = Math.min(1, grid[i] / top);
      if (t < 0.03) continue;
      const e = Math.sqrt(t);
      d[i * 4] = hr + (255 - hr) * e * 0.6; d[i * 4 + 1] = hg + (255 - hg) * e * 0.6; d[i * 4 + 2] = hb + (255 - hb) * e * 0.45;
      d[i * 4 + 3] = Math.round(255 * (0.12 + 0.88 * e));
    }
    const off = document.createElement('canvas'); off.width = gw; off.height = gh;
    off.getContext('2d').putImageData(img, 0, 0);
    c.imageSmoothingEnabled = true; c.drawImage(off, 0, 0, gw * cell, gh * cell);
  }
  function boxBlur(src, w, h, r) {
    const tmp = new Float32Array(src.length), out = new Float32Array(src.length), n = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      let acc = 0; const row = y * w;
      for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[row + x] = acc / n;
        acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc / n;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }

  function stats() {
    const n = pts.length;
    let html = `<h2>${HM.mode === 'kills' ? 'Kills' : HM.mode === 'deaths' ? 'Deaths' : 'Grenades'}</h2><div class="hmbig">${n.toLocaleString()}</div>`;
    if (HM.mode !== 'nades' && n) {
      const dist = pts.map(p => Math.hypot(p.k[5] - p.k[8], p.k[6] - p.k[9], p.k[7] - p.k[10]) * UNIT_M);
      const far = pts[dist.indexOf(Math.max(...dist))];
      const w = {}; pts.forEach(p => w[p.k[11]] = (w[p.k[11]] || 0) + 1);
      const hs = pts.filter(p => p.k[12]).length;
      html += `<div class="s muted">avg distance ${f1(dist.reduce((a, b) => a + b, 0) / n)} m · ${pct(hs / n)} headshots</div>
        <h2 style="margin-top:18px">Longest</h2><div class="s"><b>${esc(NAMES[far.k[2]] || '?')}</b> → ${esc(NAMES[far.k[3]] || '?')}<br>${f1(Math.max(...dist))} m with ${esc(weaponName(far.k[11]))}<br><a href="#/game/${far.g.id}" style="color:var(--accent)">${esc(nightLabel(far.g.night))}, round ${far.k[0] + 1}</a></div>
        <h2 style="margin-top:18px">Weapons</h2>${hbars(topWeapons(w, 6).map(([k, v]) => ({label: weaponName(k), value: v, tip: `<b>${esc(weaponName(k))}</b><br>${v}`})))}`;
    } else if (n) {
      const t = {}; pts.forEach(p => t[p.n[4]] = (t[p.n[4]] || 0) + 1);
      html += `<h2 style="margin-top:18px">By type</h2>${hbars(Object.entries(t).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({label: NADE_NAME[k], value: v, tip: `<b>${NADE_NAME[k]}</b><br>${v}`})))}`;
    }
    if (HM.view === 'dots') html += `<div class="legend" style="margin-top:16px"><span><i style="background:var(--ct)"></i>CT</span><span><i style="background:var(--t)"></i>T</span></div><div class="note">Hover a dot for details.</div>`;
    else html += `<div class="note" style="margin-top:16px">Brighter = more events.</div>`;
    $('#hmstats').innerHTML = html;
  }

  canvas.onmousemove = e => {
    if (HM.view !== 'dots' || !pts.length) { canvas.removeAttribute('data-tip'); return; }
    const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 81;
    for (const p of pts) { const d = (p.px - mx) ** 2 + (p.py - my) ** 2; if (d < bd) { bd = d; best = p; } }
    if (!best) { canvas.removeAttribute('data-tip'); return; }
    const g = best.g, when = `${esc(mapName(g.map))} · ${esc(nightLabel(g.night))} · round ${(best.k || best.n)[0] + 1}`;
    canvas.setAttribute('data-tip', best.k
      ? `<b>${esc(NAMES[best.k[2]] || '?')}</b> killed <b>${esc(NAMES[best.k[3]] || '?')}</b><br>${esc(weaponName(best.k[11]))}${best.k[12] ? ' · headshot' : ''} · ${f1(Math.hypot(best.k[5] - best.k[8], best.k[6] - best.k[9], best.k[7] - best.k[10]) * UNIT_M)} m<br>${when}`
      : `<b>${esc(NAMES[best.n[2]] || '?')}</b> · ${NADE_NAME[best.n[4]]}<br>${when}`);
  };
}
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}

// ---------- attendance & chat ----------
const clock = mins => { const h = Math.floor(mins / 60) % 24, m = Math.round(mins % 60); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
// minutes past 6 PM on the night's date, so a session past midnight keeps counting up
const nightMins = (g, start) => { const d = new Date(start); const base = new Date(g.night + 'T18:00:00'); return (d - base) / 60000; };
function attendance(gs) {
  const nights = [...new Set(gs.map(g => g.night))].sort();
  const by = {};
  for (const g of gs) {
    const n = g.rounds.length || 1;
    for (const p of g.p) {
      const a = by[p.id] = by[p.id] || {id: p.id, n: NAMES[p.id], g: 0, mins: 0, nights: {}, quit: 0, tmo: 0, chat: 0, tchat: 0};
      a.g++; a.mins += g.min * Math.min(1, p.r / n);
      a.quit += p.quit || 0; a.tmo += p.tmo || 0; a.chat += p.chat || 0; a.tchat += p.tchat || 0;
      const s0 = nightMins(g, g.start), s1 = s0 + g.min;
      const nt = a.nights[g.night] = a.nights[g.night] || {first: s0, last: s1, g: 0, mins: 0};
      nt.first = Math.min(nt.first, s0); nt.last = Math.max(nt.last, s1); nt.g++; nt.mins += g.min * Math.min(1, p.r / n);
    }
  }
  for (const a of Object.values(by)) {
    const ns = Object.keys(a.nights).sort();
    a.nn = ns.length; a.att = a.nn / nights.length; a.hours = a.mins / 60;
    a.join = ns.reduce((s, n) => s + a.nights[n].first, 0) / a.nn;
    a.msgs = a.chat + a.tchat; a.mpg = a.g ? a.msgs / a.g : 0;
    let best = 0, run = 0;
    for (const n of nights) { run = a.nights[n] ? run + 1 : 0; best = Math.max(best, run); }
    a.streak = best; a.cur = run;
  }
  return {nights, rows: Object.values(by)};
}

function viewAttendance(night) {
  const all = games();
  const allNights = [...new Set(all.map(g => g.night))].sort().reverse();
  const gs = night ? all.filter(g => g.night === night) : all;
  pageTitle(night ? `Attendance · ${nightLabel(night)}` : 'Attendance');
  if (!gs.length) return notFound();
  const {nights, rows} = attendance(gs);
  const tot = attendance(all);
  const top = (k, f = () => true) => rows.filter(r => f(r) && r[k] > 0).sort((a, b) => b[k] - a[k])[0];
  const early = rows.filter(r => r.nn >= Math.min(3, nights.length)).sort((a, b) => a.join - b.join)[0];
  const t1 = top('hours'), t2 = top('nn'), t3 = top('msgs'), t4 = top('quit'), t5 = top('streak');
  const old = gs.filter(g => !(g.v >= 6)).length;
  $('#app').innerHTML = `
    <div class="pagehead"><div><h1>Attendance &amp; chat</h1><div class="sub">${night ? esc(nightLabel(night, true)) : `${nights.length} nights`} · ${rows.length} players</div></div>
      <div class="filters"><span class="flabel">Night</span><select id="an"><option value="">All nights</option>${allNights.map(n => `<option value="${n}" ${n === night ? 'selected' : ''}>${esc(nightLabel(n))}</option>`).join('')}</select></div></div>
    <div class="tiles">
      ${t1 ? tile('Most time played', esc(t1.n), `${f1(t1.hours)} hours`, true) : ''}
      ${!night && t2 ? tile('Regular', esc(t2.n), `${t2.nn} of ${nights.length} nights`) : ''}
      ${!night && t5 ? tile('Longest streak', esc(t5.n), `${t5.streak} nights in a row`) : ''}
      ${early ? tile(night ? 'First in' : 'Early bird', esc(early.n), `${night ? 'from' : 'usually from'} ${clock(18 * 60 + early.join)}`) : ''}
      ${t3 ? tile('Chatterbox', esc(t3.n), `${t3.msgs} messages`) : ''}
      ${t4 ? tile('Rage quitter', esc(t4.n), `left ${t4.quit} game${t4.quit > 1 ? 's' : ''} mid-way`) : ''}
    </div>
    ${old ? `<div class="note">${old} game${old > 1 ? 's' : ''} parsed before chat/quit tracking show 0 for those until the next daily update.</div>` : ''}
    <section><h2>${night ? 'Who played' : 'Attendance'}</h2><div id="at"></div>
      <div class="note">Time played counts each game's length × the share of its rounds a player was in. ${night ? '' : 'Join time is the average start of each player’s first game of the night.'} Quits are leaving a game in progress (not map changes); timeouts are connection drops.</div></section>
    ${night ? '' : `<section class="card pad"><h2>Players per night</h2>${vbars(tot.nights.map(n => { const c = tot.rows.filter(r => r.nights[n]).length; return {label: nightDate(n).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}), value: c, tip: `<b>${nightLabel(n)}</b><br>${c} players`, href: `#/attendance/${n}`}; }))}</section>`}`;
  $('#an').onchange = e => { location.hash = e.target.value ? `#/attendance/${e.target.value}` : '#/attendance'; };
  const msgs = {k: 'msgs', l: 'Chat', t: 'Chat messages (all chat / team chat)', f: (v, r) => `${v} <span class="muted">${r.chat}/${r.tchat}</span>`};
  const cols = night ? [
    {k: 'n', l: 'Player', cls: 'l pname', asc: true, f: (v, r) => plink(r.id, v)},
    {k: 'join', l: 'First game', asc: true, f: (v, r) => clock(18 * 60 + r.nights[night].first)},
    {k: 'last', l: 'Last game ended', v: r => r.nights[night].last, f: v => clock(18 * 60 + v)},
    {k: 'g', l: 'Games'}, {k: 'hours', l: 'Played', f: v => `${Math.round(v * 60)} min`},
    {k: 'quit', l: 'Quits'}, {k: 'tmo', l: 'Timeouts'}, msgs,
  ] : [
    {k: 'n', l: 'Player', cls: 'l pname', asc: true, f: (v, r) => plink(r.id, v)},
    {k: 'nn', l: 'Nights', f: (v, r) => `${v} <span class="muted">${pct(r.att)}</span>`},
    {k: 'g', l: 'Games'}, {k: 'hours', l: 'Hours', f: f1},
    {k: 'join', l: 'Usual join', asc: true, f: v => clock(18 * 60 + v)},
    {k: 'streak', l: 'Best streak', t: 'Most nights in a row attended'}, {k: 'cur', l: 'Current streak'},
    {k: 'quit', l: 'Quits'}, {k: 'tmo', l: 'Timeouts'}, msgs, {k: 'mpg', l: 'Chat/game', f: f1},
  ];
  mountTable($('#at'), cols, rows, {sort: night ? 'join' : 'nn', asc: !!night, rank: true});
}

function notFound() {
  $('#app').innerHTML = `<h1>Not found</h1><p class="sub">Nothing here${onlyFin ? ' with “Completed games only” switched on' : ''}. <a href="#/" style="color:var(--accent)">Back to overview</a></p>`;
}

// ---------- router ----------
function route() {
  const [, view = '', arg, arg2] = decodeURIComponent(location.hash.slice(1)).split('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on',
    a.dataset.r === view || (a.dataset.r && view === a.dataset.r.replace(/s$/, ''))));
  ({'': viewOverview, nights: viewNights, night: () => viewNight(arg), games: viewGames, game: () => viewGame(arg),
    maps: viewMaps, map: () => viewMap(arg), players: viewPlayers, player: () => viewPlayer(arg),
    weapons: viewWeapons, weapon: () => viewWeapon(arg), awards: viewAwards, utility: () => viewUtility(arg), rounds: () => viewRounds(arg), heatmap: () => viewHeatmap(arg, arg2), attendance: () => viewAttendance(arg)}[view] || notFound)();
  tip.style.opacity = 0;
}
addEventListener('hashchange', () => { route(); scrollTo(0, 0); });

document.querySelectorAll('.brandtxt').forEach(e => e.textContent = DATA.title);
const fmtWhen = d => d.toLocaleString('en-US', {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'});
const ago = d => { const m = Math.max(0, Math.round((Date.now() - d) / 60000)); return m < 60 ? `${m}m ago` : m < 48 * 60 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const synced = DATA.synced ? new Date(DATA.synced) : null;
const syncEl = $('#synced');
if (synced) {
  syncEl.textContent = 'Synced ' + ago(synced);
  syncEl.title = 'Last sync with the server: ' + fmtWhen(synced);
  if (Date.now() - synced > 36 * 3600e3) { syncEl.classList.add('stale'); syncEl.textContent = '⚠ ' + syncEl.textContent; syncEl.title += ' (the daily update may be failing)'; }
} else syncEl.textContent = 'Not synced yet';
const sync2 = $('#synced2');
sync2.textContent = syncEl.textContent; sync2.title = syncEl.title; sync2.className = syncEl.className;
$('#foot').innerHTML = `Built from CS2 server logs · ${ALL.length} games · last synced ${synced ? esc(fmtWhen(synced)) : '–'} · last game ${esc(DATA.updated ? fmtWhen(new Date(DATA.updated)) : '–')}`;
const finBoxes = [$('#onlyFin'), $('#onlyFin2')];
finBoxes.forEach(c => {
  c.checked = onlyFin;
  c.onchange = e => { onlyFin = e.target.checked; finBoxes.forEach(x => x.checked = onlyFin); try { localStorage.setItem('cs2.onlyFin', onlyFin ? '1' : '0'); } catch (x) {} route(); };
});
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cs2.theme', document.documentElement.dataset.theme); } catch (x) {}
};
try { const t = localStorage.getItem('cs2.theme'); if (t) document.documentElement.dataset.theme = t; } catch (x) {}
route();
}).catch(e => {
  document.getElementById('app').innerHTML = `<h1>Could not load stats</h1><p class="sub">data/games.json failed to load (${String(e.message || e).replace(/[<>&]/g, '')}). If you opened this file directly, serve the docs folder over HTTP instead.</p>`;
});
</script>
