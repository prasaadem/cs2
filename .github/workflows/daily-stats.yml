name: Daily stats

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 9 AM PDT / 8 AM PST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download server logs from DatHost
        env:
          DATHOST_EMAIL: ${{ secrets.DATHOST_EMAIL }}
          DATHOST_PASSWORD: ${{ secrets.DATHOST_PASSWORD }}
          DATHOST_SERVER_ID: ${{ secrets.DATHOST_SERVER_ID }}
          DATHOST_ACCOUNT_EMAIL: ${{ secrets.DATHOST_ACCOUNT_EMAIL }}
        run: python stats/fetch_dathost.py --out "$RUNNER_TEMP/logs"

      - name: Merge new games into data/games
        id: update
        run: python stats/update_stats.py --logs "$RUNNER_TEMP/logs" --changes "$RUNNER_TEMP/changes.json"

      - name: Build site
        run: python stats/build_site.py --mark-synced

      - name: Commit and push
        run: |
          git add data docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the sync time changes on every run, so there is always something to commit
          if [ "${{ steps.update.outputs.changed }}" = "true" ]; then
            git commit -m "Stats: ${{ steps.update.outputs.summary }}"
          else
            git commit -m "Sync: no new games"
          fi
          git push

      # only when the sync brought new data, the push succeeded and a webhook is configured
      - name: Post to Discord
        if: steps.update.outputs.changed == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: python stats/notify_discord.py --changes "$RUNNER_TEMP/changes.json" --wait-for-site
